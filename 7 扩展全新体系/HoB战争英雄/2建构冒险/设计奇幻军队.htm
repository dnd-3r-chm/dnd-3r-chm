<p class=MsoNormal style='text-indent:32.0pt'><b><span style='font-size:16.0pt;
font-family:"微软雅黑",sans-serif'>设计奇幻军队</span></b></p>

<p class=MsoNormal style='text-indent:32.0pt'><b><span lang=EN-US
style='font-size:16.0pt;font-family:"微软雅黑",sans-serif'>DESIGNING A FANTASY ARMY</span></b></p>

<p class=MsoNormal style='text-indent:28.0pt'><span style='font-size:14.0pt;
font-family:"微软雅黑",sans-serif'>当你设计一支奇幻军队时，为每个士兵创建完整数据通常是在浪费时间。即使是最活跃的玩家角色队伍，在一场特定战斗中也只会与一支军队的极小部分接触。你只需要担心那一小部分即可。其余的部分你只需大致描述即可。</span></p>

<p class=MsoNormal style='text-indent:28.0pt'><span style='font-size:14.0pt;
font-family:"微软雅黑",sans-serif'>创建一支奇幻军队的核心任务是设计机动单位：战场上一起移动的一个有凝聚力的士兵群体。如果你创造的军队拥有有趣的机动单位，那么无论是作为敌人还是盟友，玩家角色与其互动都会很有趣。</span></p>
