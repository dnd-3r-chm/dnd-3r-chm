<h1>无名变体：德鲁伊</h1>
<p>德鲁伊或许会选择放弃他的荒野变形能力，然后成为一个迅捷且致命的猎人。</p>
<p><b>获得：</b>无甲AC加值(如同武僧，使用感知加值)、快速移动(如同武僧)、宿敌(如同游侠)、奖励专长：追踪(如同游侠)、快速追踪(如同游侠)。</p>
<p><b>失去：</b>防具与盾牌擅长、荒野变形。</p>
