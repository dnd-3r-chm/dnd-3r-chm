<h1>无名变体：术士/法师</h1>
<p>术士或法师或许会渴望一个更为耐用的伙伴来帮助他进行荒野探险。</p>
<p><b>获得：</b>动物伙伴。(如同德鲁伊，使用术士或法师等级的一半作为等效德鲁伊等级)</p>
<p><b>失去：</b>魔宠。</p>
