    <h1>第三章：虫类生物</h1>
    <p>本章包含各种突变虫类生物的数据以及基本资料。这些生物一切行动全凭本能，只有觅食或繁殖这类单纯的意念。</p>

    <span class="title-bold">虫类特性：</span>
    <p style="text-indent:0;margin-bottom:8px;">虫类生物具有下列特性（叙述中特别注明者例外）。</p>
    
    <div class="list-item"><span class="highlight">— 无心智：</span>无智力值，对影响心灵的效果免疫（魅惑、胁迫、魅影幻象、心灵幻象和士气效果）。</div>
    <div class="list-item"><span class="highlight">— 黑暗视觉</span>60英尺。</div>
    <div class="list-item"><span class="highlight">— 阵营：</span>总是中立，人类的道德观不适用于虫类生物。</div>
    <div class="list-item"><span class="highlight">— 宝藏：</span>虫类生物通常没有宝藏。若有的话，那就是之前被怪物杀死的生物所留下来的。</div>
