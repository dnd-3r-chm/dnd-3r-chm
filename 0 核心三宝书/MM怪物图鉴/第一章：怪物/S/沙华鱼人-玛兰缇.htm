<div class="h">
<h1>玛兰缇 (Malenti)</h1>
<small>沙华鱼人变种</small>
</div>
<div class="desc">
<p>约每两百个沙华鱼人中会有一个拥有四只手臂。除了原本的啮咬与爪抓外，这种生物还可用四爪攻击，并使用额外武器。</p>
<p>如果水生精灵社群与沙华鱼人社群相离不到100英里，则每100个沙华鱼人会有一个长得像水生精灵。这些生物被称为玛兰缇，游泳速度40英尺，每1点体质代表可离水1小时，且对淡水过敏 (在强光中目眩)。</p>
<p>玛兰缇不具有天生武器，除此之外与沙华鱼人相同。</p>
