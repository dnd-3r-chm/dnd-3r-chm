<div class="desc">
<p>泥形怪是不定形的生物，生存的目的就是进食。他们栖息在地底、天然洞穴、废墟及地下城中，不断寻觅着有机物质——无论死活。</p>

<p style="margin-top:6px"><b>盲感 (特异)：</b>泥形怪整个身体就是原始感觉器官，可利用气味及震动辨明60英尺范围内的猎物。</p>
