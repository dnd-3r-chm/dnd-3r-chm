<div class="h">
<h1>纳迦 (Naga)</h1>
<small>大型异怪 | 挑战级数 视种类而定</small>
</div>
<div class="desc">
<p>纳迦是具有多种魔法能力的高智力生物。他们是周遭生物的天然领主，使用精巧的结界与陷阱来防止入侵者打扰他们的平静。</p>
<p>所有纳迦都有像蛇一样的长身体，长满了发光的鳞片及几张人脸。他们身长约10英尺到20英尺不等，重约200至500磅。纳迦的眼睛明亮智慧，散发着催眠般的内敛光芒。</p>
</div>
<div class="sec">战斗 (通用)</div>
<div class="ab">
<p>纳迦喜爱法术远超过其他战斗方式。因为遇上他们之处几乎都是在他们所护卫的老巢附近，对四周所知甚详的优势让他们可随心所欲安排战斗地点或情境。</p>
</div>
