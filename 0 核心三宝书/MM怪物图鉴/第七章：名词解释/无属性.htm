<body><div class="container"><h1>无属性</h1><p>有些生物缺少某些属性值，这并不表示该生物的属性值为0，而是该项属性根本不适用。无属性的调整值为+0，其他效果如下所述。无力量属性的生物对外界根本无抵抗力，如幽灵。无敏捷属性的生物完全无法移动，如尖叫藤。无体质属性的生物没有躯体，如幽灵或虚体生物。无智力属性的生物没有心智。无感知属性的生物无法感知周围事物。无魅力属性的生物不存在个人意志。</p></div></body></html>
