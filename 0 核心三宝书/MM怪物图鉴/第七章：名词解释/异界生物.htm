<body><div class="container"><h1>异界生物</h1><p>只要有部分生命要素（不一定是肉体）来自物质界以外的界域，就属于异界生物。有些生物出生时并非异界生物，经历历练或提升（或降低）精神层次之后才成为异界生物。</p><p><span style="color:#A44797;font-weight:bold;">特征：</span>异界生物具有下列特征：</p><p style="text-indent:0;margin-left:2em;line-height:1.8;">— <span style="color:#A44797;font-weight:bold;">生命骰 d8</span>。<br>— <span style="color:#A44797;font-weight:bold;">基本攻击加值</span>等于生命骰（同战士）。<br>— <span style="color:#A44797;font-weight:bold;">强韧、反射和意志检定较佳</span>。<br>— <span style="color:#A44797;font-weight:bold;">每增加一个生命骰</span>可获得的技能点数=8+智力调整值，最少1点。第一个生命骰可获得四倍技能点数。</p></div></body></html>
