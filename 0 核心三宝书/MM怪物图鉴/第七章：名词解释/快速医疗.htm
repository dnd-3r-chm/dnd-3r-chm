<body><div class="container"><h1>快速医疗</h1><p>某些生物具有能够迅速回复生命值的特异能力。在其回合开始时，便可获得固定点数的生命值。快速医疗与自然医疗相同（见《玩家手册》第147页）。快速医疗能力无法使生物重新长出或接合断肢，这不同于再生能力（见298页）。具有快速医疗能力的生物同时受到非致命与致命伤害时，会先治疗非致命伤害。快速医疗无法回复因饥饿、干渴或窒息而损失的生命值。快速医疗也无法增加因变形而增加的生命值。</p></div></body></html>
