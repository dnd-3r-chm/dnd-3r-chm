<body><div class="container"><h1>掘穴</h1><p>具有遁地速度的生物可以在泥土中挖掘前进，但不能穿过岩石，除非特别注明。在掘穴时，不能够进行冲刺或奔跑。大部分生物在遁地之后并不会留下一条可供其他生物穿越的隧道（可能因为隧道在穿越之后立刻坍塌或是生物根本无法挖空就可以直接在地下移动）。细节请见个别生物的叙述文字。</p></div></body></html>
