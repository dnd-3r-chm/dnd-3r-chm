<h1 class="title">社会文化</h1>
<p>要创造跟典型设定不相同的世界，你可以简单的套用现实世界中不同的文化背景。参考非洲、中美洲或阿拉伯文化编写战役会很有趣也很有成就感。但不要因你所选的文化而画地自限，如果你不喜欢历史上的非洲战士不穿铁甲这一事实，你可以在你的世界里忽略他。虽然多数官方世界的预设文化背景是中世纪欧洲，但他们跟历史同样相去甚远。请记得本章前面所述，设定剧情时必须顾及的基本要素。魔法真实存在对其他文化的改变，一点也不比对比欧洲文化的改变小。</p>
