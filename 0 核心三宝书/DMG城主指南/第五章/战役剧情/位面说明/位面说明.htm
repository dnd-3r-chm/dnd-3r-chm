<p>构成巨轮的各位面简述如下：</p>
<p>各过渡位面和内层位面都有自己的随机遭遇表。外层位面则共用四张随机遭遇表，依位面说明来决定哪张最适用。本节中所有事件遭遇表均设计为泛用，如果你想设计一个其他位面围绕地点的冒险，可从本节的表格出发设计独特的遭遇表。</p>
