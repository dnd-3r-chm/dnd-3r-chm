<h1 class="title">分层位面</h1>
<p>无限可以分成许多小型无限，位面亦可区分成更小的相连位面。这些位面层（Layers）实际上是独立位面，且具有自己的位面特征。位面层之间是靠传送门、自然漩涡、通路及流动边界来互相连接。</p>
<p>位面的出入点通常都在第一层，亦即最顶层或最底层，依位面环境不同。许多固定出入点（如传送门与自然漩涡）都会通到这一层，使他成为与其他位面的沟通通道。“异界传送”亦会将施法者送到这一层。</p>
<p>所有位面层都与星界连接，因此旅行者可通过“星界投射”之类的法术直接到达各层，但通常只有第一层对旅行者较舒适。</p>
