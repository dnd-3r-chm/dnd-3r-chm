<h1 class="title">从低级到高级的过渡</h1>
<p>战役中最有趣最有成就感的——对DM和玩家来说都是如此——就是那缓慢但稳定的人物升级过程了。人物会由低等级（2-5级）逐渐升至中等级（6-11）、高等级（12-15），最后到达极高级（16-20）。低级时的游戏跟高级时的游戏有着截然不同的体验。低等级人物活下来并不容易，而要重创高等级人物同样很艰难。虽然你应始终公平，不过在低等级时应更注意交给玩家人物的挑战不要太过艰难。等他们高等级了你有的是机会放出你想放的随便什么东西——高等级人物有足够的资源和力量来应对克服几乎所有困难。</p>
