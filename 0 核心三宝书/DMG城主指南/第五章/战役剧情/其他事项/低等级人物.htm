<h1 class="title">低等级人物</h1>
<p>面对起始人物或低等级玩家人物时，须留意下列事项：</p>
<ul>
<li>这些玩家人物很脆弱，豁免加值低、AC低、生命值也少。</li>
<li>碰到两三个遭遇以后，他们就需要休息。</li>
<li>不能离开文明地区太远。</li>
<li>他们无法指望依赖于某项特定能力。比如牧师虽然准备了某个法术，但他无法保证等到真正需要的时候，那个法术还没被他提前用掉。低等级人物的法术持续时间短，可用资源也少。</li>
</ul>
