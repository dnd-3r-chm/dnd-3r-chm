<h1 class="title">对魔法的限制</h1>
<p>某些文明地区会限制或禁止使用魔法。施法者施法可能需要执照或经过地方管理者的允许，除此之外，使用魔法是被禁止的。在这些地方，魔法物品或法术效果很少见，但对法术的防护措施却未必少见。</p>
<p>某些地区会禁止特定法术，比如说，使用那些可能用于偷盗或说谎的法术，诸如隐形或者制造幻术，都会被看做犯罪。附魔系法术常被禁止，特别是“魅惑”、“暗示”、胁迫或支配类法术，因为他们会妨害受术者的自由意志。破坏类法术也常被禁，理由可想而知。</p>
<p>各地领主也可能会因为害怕某种法术效果（例如怕被变成动物）而禁止特定法术。</p>
