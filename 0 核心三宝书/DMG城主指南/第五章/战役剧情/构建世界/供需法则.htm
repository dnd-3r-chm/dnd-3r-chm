<h1 class="title">供需法则</h1>
<p>供需法则会对货币价值产生重大影响。如果玩家突然在一个地区使用大量金币，商人们很可能会提高货物价格。这不是敲诈，而是小地方的基本经济法则。如果身怀巨款的冒险队伍在小镇酒馆中花100金币购买上好食宿服务，酒馆主人也会花用这笔财富。同样的，小镇里的所有人短期内的花销都会增加。而花销增加意味着消费扩张，商品和服务变得相对稀缺，物价也就上涨了。</p>
<p>供求关系也可能间接影响战役内非关金钱的事务。举例而言，地方领主征收了该地区所有快马作为战马。玩家们想买马时，会发现买不到合理价格的马。他们只能买跑得较慢的弩马或必须花上一笔庞大的代价才买得到好马。</p>
