<h1 class="title">社区里的非玩家人物</h1>
<p>在细致的城市团中，知道社区里究竟生活了些什么人变得至关重要。此时可参考以下方式决定重要居民的最高职业等级，并推算出其他带等级的人物的数量。</p>
<p>社区中各职业等级最高的非玩家人物：下列两张表可决定特定职业等级最高的人物。请依据第二张表中各职业的骰数掷骰，再根据第一张表中的社区大小做调整。若结果为零或更低，表示该社区中没有该职业的人物。每个职业的最高等级都是20级。</p>
