<h1 class="title">追随者 (Followers)</h1>

<p>追随者与部属类似，但通常是较低等级的NPC。由于他们大多追随高于自己5级以上的玩家人物，因此对战斗不太有帮助。但聪明的玩家人物会派遣他们作为密探、间谍、使者、跑腿或守卫。</p>

<p>追随者不会获得经验值，因此也不会升级。然而，当拥有“领导力”专长（见106页）的人物升级时，可以查阅“领导力”专长的表格，看是否能吸引更多追随者，其中可能会有等级更高的追随者（这与部属不同，你不需要查表判断部属等级，因为部属会自己获得经验值升级）。</p>

<p>追随者不要求分享宝藏，但需要玩家人物提供装备与饮食。</p>
