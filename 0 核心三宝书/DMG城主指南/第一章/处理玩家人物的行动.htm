<h1 class="title">处理玩家人物的行动</h1>
<p>处理玩家人物的行动时，最重要的是让每个玩家自主控制他的人物。不要强迫玩家做出某项行动（除非他的人物被魔法控制，请见下文）。不要为玩家决定其人物对事物持有的看法。即使某个高魅力值的NPC试图说服玩家人物，也不要只以掷骰来决定人物的反应。游戏中的某些规则只适用于NPC，不适用于玩家人物。NPC的态度即为一例（见128页或《玩家手册》72页）。该规则不能用于改变玩家人物对NPC的看法。操控NPC时，你可以尽情说谎、欺诈、花言巧语或诋毁玩家人物，但不要以身为DM的权力剥夺玩家扮演自己人物的乐趣。</p>
