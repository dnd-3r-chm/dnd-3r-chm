<h1 class="title">绘制地图</h1>
<p>当玩家们来到一个新地方，而有人想画下这个区域的地图时，请给他一点帮助。尽可能详细说明他想知道的配置，包括房间或空间的大小。若为了澄清细节，你也可以在方格纸上画出房间形状与大小。有需要的话，请耐心地复述。告诉玩家其人物看到的（请考虑照明与人物视力）或合理估计（例如远端壁面的距离）的结果。</p>
<p>当然这也有例外，当队伍在地下城里迷路或处于浓雾中，整个剧情的重点就是要让他们搞不清楚身在何处。在这种情况下，就不用给绘制地图者任何帮助。如果他们在迷宫中前进，却转错弯，让他们由原路退回也是很有趣的。</p>
