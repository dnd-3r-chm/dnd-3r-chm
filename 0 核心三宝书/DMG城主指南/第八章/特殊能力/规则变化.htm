<body><!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>规则变化：非魔法的灵能</title>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">
<style>
* { box-sizing: border-box; }
html,body { 
	font-family: Arial, Helvetica, sans-serif;
}
body{
	margin: 0;
	padding: 40px 20px;
	background: #f5f2e8; /* 外围的米黄色底色 */
	font-family: "SimSun", "Microsoft YaHei", sans-serif;
	display:block;
	
}
.page{
	width: 980px;
	max-width: 100%;
	background: #ffffff; /* 中间的白色纸张 */
	padding: 40px 50px;
}
h1.title{
	font-size: 28px;
	font-weight: normal;
	color: #973A93;
	border-bottom: 2px solid #973A93;
	padding: 0 0 10px 0;
	margin-bottom: 20px;
	display:block;
	
}
/* 双栏布局容器 */
.two-column {
	display:block;
	
	 /* 保持两列顶部对齐 */
}
/* 每一列的段落样式 */
.two-column p {
	text-indent: 2em; 
	margin: 0; /* 清空段落的上下边距，让左右两段文字视觉高度相等 */
	line-height: 1.6;
	flex: 1; /* 让左右两列平分宽度 */
}
@media (max-width: 900px){
	body { padding: 20px 10px; }
	.page { 
		padding: 20px 15px; 
	}
	/* 手机端调整为上下单列显示 */
	.two-column {
		flex-direction: column;
		
	}
	.two-column p {
		margin: 0 0 0.8em 0; /* 手机单列时恢复段间距 */
	}
}
</style>

<style id="codex-layout-final">
.page, .container, .w {
    width: 100% !important;
    max-width: 1100px !important;
    margin: 0 auto !important;
    box-sizing: border-box;
}
</style>
</head>
<body>
<div class="page">
<h1 class="title">规则变化：非魔法的灵能</h1>

<div class="two-column">
	<p>灵能不属于魔法，而是另一种特殊力量。反魔场对使用灵能能力毫无影响（同样地，灵能能力亦无法影响魔法）。生物对于魔法的特殊免疫能力或抵抗能力无法阻挡灵能能力。</p>
	
	<p>使用这条规则变化有其危险，由于无需和针对魔法一样进行传统上的检定，因此灵能能力在游戏中可能造成过于强大的威胁。既然传统的魔法防御对灵能能力无效，宝藏列表与法术就必需添加对灵能能力的防御。</p>
</div>

</div>
</body>
