<h1 class="title">特殊能力、状态总览与环境危害</h1>

<p>本章内容分为“特殊能力”、“状态总览”和“环境危害”三部分。在“龙与地下城”规则中，常常提到各式各样的特殊能力，例如：能量射线、麻木触碰或是化为虚体的能力。“特殊能力”章节包含了一些最重要的特殊能力，说明如何使用这些能力以及他们的效果。</p>

<p>接着是“状态总览”，包括所有人物可能发生的状态，如：恐慌、麻痹和无助。如果人物受到特殊效应的影响而陷入某种状态，请查阅本章节以决定如何处理。</p>

<p>最后，所有因外在条件而造成的危机则列举于“环境危害”章节，包括：溺水、高温或酷寒等。</p>
