<h1 class="title">疾病（Diseases）</h1>
<p>当人物受到带有病原生物的攻击（如：木乃伊的挥击可以传染腐尸症），触碰遭污染的物品或是接触了传染源，食用了不洁的饮食，便须立即进行强韧检定。若通过检定，便不会染上疾病。若检定失败，经过一段潜伏期便会受到伤害。此后，他每天都必须通过强韧检定以避免继续受伤害。若连续两次检定成功，他便康复，不再受到疾病侵扰。</p>
<p>你可以私下为玩家进行强韧检定，这样他就不会知道他的人物是否仍然患病。</p>
