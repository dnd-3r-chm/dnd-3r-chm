<h1 class="title">黑暗视觉（Darkvision）</h1>
<p>黑暗视觉是一种能在完全无光的环境中看见事物的特异能力，有效范围视个别生物而定。</p>
<p>使用黑暗视觉能力时，所见事物只有黑白两色，无法分辨色彩。黑暗视觉无法使生物看到视力无法察觉的生物，隐形物体仍是隐形，幻觉对他仍然逼真。因此，使用黑暗视觉的生物仍会受到凝视攻击。</p>
<p>黑暗视觉不受环境中的光源干扰。若人物具有黑暗视觉范围60英尺，同时持有20英尺照明范围的光源，则可以清楚看到身边20英尺和照明范围外40英尺的东西。</p>
