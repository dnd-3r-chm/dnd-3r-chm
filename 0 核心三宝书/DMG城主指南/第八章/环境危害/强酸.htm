<h1 class="title">强酸 (Acid Effects)</h1>
<p>腐蚀性的强酸每轮会对接触者造成1d6点伤害，若人物浸泡在强酸中（例如泡在装满强酸的大桶中），每轮会受到10d6点伤害。遭到强酸攻击，无论是掷扁瓶装的强酸或怪物的吐出的酸液，都视同接触强酸一轮。</p>
<p>大多数强酸所蒸发的气体都是呼吸性毒素。那些离大量强酸太近的人物必须进行强韧检定（DC=13），失败便受到1点体质伤害。而且该人物在1分钟后还须进行第二次检定，失败会再度受到1d4点体质伤害。</p>
<p>对强酸腐蚀效果免疫的生物若完全浸泡在强酸中，仍可能溺毙（见304页有关溺水的说明规则）。</p>
