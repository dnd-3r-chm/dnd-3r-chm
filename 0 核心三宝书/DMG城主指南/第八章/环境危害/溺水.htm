<h1 class="title">溺水 (Drowning)</h1>
<p>人物每点体质值可以闭气2轮，超过这段时间之后，每轮都要进行体质检定（DC=10，每再检定便再+1）。只要任何一次体质检定失败，人物就会慢慢溺水。开始的第一轮，人物陷入昏迷，生命值等于0。下一轮陷入濒死，生命值降到-1。第三轮就溺毙。</p>
<p>在并非水域的环境中也可能溺毙，例如：沙堆、流沙、大量粉尘或是装满谷物的谷仓。</p>
