<h1 class="title">烟雾 (Smoke Effects)</h1>
<p>吸入浓烟的人物每轮须进行强韧检定（DC=15，每再检定便再+1），若失败则该人物在将该轮会被这股浓烟呛到而咳嗽不止。人物若连续2轮都被浓烟呛到，会受1d6点非致命伤害。</p>
<p>烟雾会遮蔽视线，身处烟雾中的人物隐蔽效果（对方有20%的失手率）。</p>
