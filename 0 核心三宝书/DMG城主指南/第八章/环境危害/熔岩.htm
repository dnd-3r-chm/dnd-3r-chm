<h1 class="title">熔岩 (Lava Effects)</h1>
<p>生物若接触熔岩或岩浆，每轮会受到2d6点伤害。若浸泡在熔岩中（例如当人物掉进活火山口），每轮会受到20d6点伤害。即使停止接触熔岩，仍会持续受伤1d3轮，但此时所受的伤害为接触时所受伤害之半（即每轮受到1d6或10d6点伤害）。</p>
<p>能抵抗火焰伤害或对火焰伤害免疫的生物，也能抵抗熔岩或岩浆的伤害或甚至免疫。但对火焰免疫的生物若浸泡在熔岩中，仍可能会溺毙（见前文有关溺水的说明）。</p>
