<h1 class="title">以怪物作为史诗人物</h1>
<p>对于具有人物等级的怪物，以上所有关于绝世人物的规则都一体适用。须注意的是，怪物的有效人物等级等于职业等级、生命骰和等级修正值三者总和。例如：熊地精的生命骰3，等级修正值+2，若为14级战士兼3级暗黑卫士，则有效人物等级22，所以可以获得史诗攻击加值和豁免检定加值。</p>
<p>《怪物图鉴》中列举了许多怪物的等级修正值，表示这些怪物可以当作人物。你可以参考将这些生物纳入自己的背景设定之中，当作特殊的玩家人物种族。</p>
