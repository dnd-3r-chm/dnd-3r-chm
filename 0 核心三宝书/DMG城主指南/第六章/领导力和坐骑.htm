<h1 class="title">领导力和坐骑</h1>
<p>有些机灵的人物会用“领导力”专长来招募部属充当坐骑，以这种方式取得的坐骑智力值至少为4。如果人物本来就有专用坐骑、魔宠或动物伙伴，“领导力”会受到-2减值。本书199页的表格中，列举了一些可以当作坐骑的特殊部属，以此为范例，你可以自行创造其他特殊坐骑部属。</p>
