<h1 class="title">创造新职业</h1>
<p>你当然可以创造一个全新的职业或彻底改变现有职业的样貌。例如：你可以对巡林客进行下列调整：</p>
<ul>
<li>限制武器选择，改为类似游荡者的擅长武器。</li>
<li>夙敌只限于不死生物，每5级就可以多获得+2加值。</li>
<li>赋予游荡者的偷袭能力，但改为只对不死生物有用。</li>
<li>改变法术列表，只包含牵涉不死生物、欺瞒与潜行的法术。</li>
<li>3级时，赋予圣武士的破邪斩，但只对不死生物有效。</li>
</ul>
<p>依照上述修改之后的新职业可以称为“死灵潜猎者”，这是精于潜行追踪、猎杀不死生物的职业。</p>
<p>如果你真的想创造全新职业，不妨试着将不同职业混合搭配。</p>
