<h1 class="title">调整种族范例：</h1>
<h2 class="subtitle">半人精灵（Half-Human Elves）</h2>
<p>半人精灵是由精灵而非人类抚养长大的半精灵。</p>
<p>半人精灵的种族特性和《玩家手册》18页半精灵相同，只有下列三点例外：</p>
<ul>
<li>半人精灵的“交涉”和“收集信息”检定不能获得种族加值。</li>
<li>半人精灵擅长的武器和精灵一样。因为由熟悉剑术和箭术的精灵养大，半人精灵在持用长剑、细剑、短弓和长弓时，视为具有“擅长军用武器”专长。</li>
<li>天赋职业：法师。半人精灵不像人类养大的半精灵那样容易适应各种职业。</li>
</ul>
