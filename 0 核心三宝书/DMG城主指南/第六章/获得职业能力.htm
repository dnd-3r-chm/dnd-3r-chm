<h1 class="title">获得职业能力</h1>
<p>你可规定人物升级时必须经过完整训练，才能获得职业能力。升级时，每两级需要一周的时间训练，小数无条件进位（换句话说，升3级时必须花两周）。训练时必须有一个等级较高的同职业者进行指导，每周费用是1000金币。如果找不到教练，则训练费用同上，但训练时间加倍。训练费用包含学费、咨询费、实验材料费与其他杂项支出。未经训练的玩家无法提升生命值、职业能力、豁免检定、攻击加值、每日法术数量、技能与新法术等能力。</p>
