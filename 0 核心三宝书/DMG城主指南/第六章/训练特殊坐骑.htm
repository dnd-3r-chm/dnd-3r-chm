<h1 class="title">训练特殊坐骑</h1>
<p>在《玩家手册》74页关于“驯养动物”技能的说明中，有提到该技能也可用来训练智力1或2的魔法兽。身为DM，你有权决定“驯养动物”技能是否可以用来训练其他种类的低智力生物当作坐骑。</p>
<p>以虫类生物来说，如果你要开放让这类生物当作坐骑，事前必须先设计相关的背景。例如：你可以说某个地精部落专门驯养了一群特殊的变种蜘蛛充当坐骑，或者是某个魔法物品可以让穿戴者获得命令虫类生物当作坐骑的能力，你也可以设计炼狱虫类生物坐骑（不过天界虫类听起来就有点不太对劲）。</p>
