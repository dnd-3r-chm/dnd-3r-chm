<h1 class="title">调整种族</h1>
<p>有时你可能想调整某个《玩家手册》中所列的标准种族。这和创造亚种不同，因为这会改变整个世界所有该标准种族人物的特征。有些世界可能没有亚种，只有调整过的标准种族。</p>
<p>一般而言，之所以会想调整《玩家手册》中的种族，主要是为了让自创的战役剧情变得较为独特。例如：有些世界中的矮人从不施展奥术，而在另一个世界里，他们却可能都成为奥术大师。</p>
