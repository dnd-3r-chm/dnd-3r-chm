<h1 class="title">智慧坐骑</h1>
<p>与一般坐骑不同，智力值5或更高的坐骑其实比较像是NPC。因此，想要骑乘这类坐骑的人物必须先进行“交涉”检定与坐骑沟通（详见《玩家手册》72页关于影响NPC态度的说明）。双方必须达成共识之后，人物才可以继续进行“驯养动物”技能检定以训练该生物成为坐骑。训练所需的时间与一般坐骑相同（见《玩家手册》74页），但特殊坐骑可能会要求某些条件，例如：要有专人照料生活起居、特殊的食物或甚至要求分享冒险队伍获得的宝藏。</p>
