<h1 class="title">机关陷阱费用</h1>
<p>机关陷阱的基本费用是1,000金币。参考表3-15中各项陷阱特色的调整值，以计算出陷阱总共需要费用。</p>
<p>陷阱总需费用等于（调整后基本费用 x 挑战级数）+ 额外费用。机关陷阱最低费用为（CR x 100）金币。</p>
<p>在再调整后基本费用与挑战级数相乘后，加上使用于陷阱中的炼金物品或毒素的价钱。如果陷阱中含有这些要素而且可以自动重新作用，那么毒素或炼金物品的花费需再乘以20，以确保用量不致匮乏。</p>
<p><strong>多重陷阱：</strong>若陷阱由两个以上陷阱组成，分别计算各个陷阱所需花费后，再加总即可得出此多重陷阱所需费用。多重依赖陷阱或多重独立陷阱（见上节）的费用均依此计算。</p>
