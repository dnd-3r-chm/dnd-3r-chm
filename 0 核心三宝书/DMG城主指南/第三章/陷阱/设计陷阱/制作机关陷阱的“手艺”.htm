<h1 class="title">制作机关陷阱的“手艺”DC</h1>
<p>确定玩家人物想要陷阱的挑战级数后，参考下表决定“手艺：制作陷阱”DC。</p>

<table>
<tr><th>陷阱CR</th><th>基本“手艺：制作陷阱”DC</th></tr>
<tr><td>1-3</td><td>20</td></tr>
<tr><td>4-6</td><td>25</td></tr>
<tr><td>7-10</td><td>30</td></tr>
</table>

<table>
<tr><th>额外成分</th><th>“手艺：制作陷阱”DC调整值</th></tr>
<tr><td>邻近程度重新作用</td><td>+5</td></tr>
<tr><td>自动重新作用</td><td>+5</td></tr>
</table>

<p>进行检定：要确定人物制作陷阱的每周进度，该人物需进行“手艺：制作陷阱”检定。请参考《玩家手册》第70页对“手艺”技能的说明内容。</p>
