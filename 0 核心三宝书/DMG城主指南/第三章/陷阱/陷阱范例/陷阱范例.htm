<h1 class="title">陷阱范例</h1>
<p>以下这些常见的机关陷阱，可用于保护地下城、商人公会、军事基地等等。所标示的费用为机关陷阱的市价或是魔法陷阱的材料费用。施法者等级与法术等级的相关叙述请参考各魔法装置陷阱与法术陷阱的内容。至于其他所使用的法术（例如用以触发陷阱），底下所标示的施法者等级为最低要求。</p>
