<h1 class="title">幕后随谈：陷阱</h1>
<p>为何要使用陷阱？陷阱能改变游戏的进行。如果冒险者曾遇过陷阱，他们之后冒险时就会小心点，尤其在地下城内更是如此。虽然令玩家恐惧紧张很有意思，但也会使游戏步调变慢。若是每条通道都要步步为营、仔细搜索，玩家或DM都会感到疲乏。</p>
<p>解决办法是只在适当的地方放置陷阱，一般人会在墓穴或藏宝库设置陷阱，以避免入侵。若是在自己常经过的地方设置陷阱，就不太合理，智慧生物不会设置可能害到自己的陷阱。</p>
