<h1 class="title">回避（选择性要素）</h1>
<p>陷阱制造者若要在陷阱设置后通过，就得在陷阱上增加回避机制，以避免触发陷阱。回避要素通常只适用于机关陷阱，法术陷阱通常内建有准许设计者进出的机制。</p>
<p><strong>锁：</strong>解开回避锁须通过“开锁”检定（DC=30）。</p>
<p><strong>隐藏开关：</strong>要发现隐藏开关须通过“搜索”检定（DC=25）。</p>
<p><strong>隐藏锁：</strong>结合上述两者，需要通过“搜索”检定（DC=25）及“开锁”检定（DC=30）。</p>
