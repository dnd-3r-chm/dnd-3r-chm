<h1 class="title">洪水</h1>
<p>在许多野外地区，河川会定期泛滥。初春融雪时，溪流与河川都可能会暴发洪水。其他例如倾盆大雨或水坝溃堤等情形，也都会导致洪水泛滥。</p>
<p>在洪水期间，河川会变宽、变深，也变得更加湍急。春洪泛滥时，河川水位会增高1d10+10英尺，河面则会增宽1d4x50%倍，原本的浅滩会消失无踪，桥梁会冲毁断折，而渡船也无法横渡。</p>
<p>洪水泛滥时，在河川中进行“游泳”检定时，难度需提高一级（静水变涌流，涌流变怒涛）。河川流速也会加快50%。</p>
