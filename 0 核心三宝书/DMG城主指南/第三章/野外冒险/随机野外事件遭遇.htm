<h1 class="title">随机野外事件遭遇</h1>
<p>冒险途中行经野外便会遇上随机野外事件遭遇，而你首先需确定该地区的事件遭遇发生几率。参考下表，队伍在野外每停留一小时便掷百分骰决定是否发生事件遭遇。</p>

<table>
<tr><th>地点类型</th><th>发生事件遭遇百分率</th></tr>
<tr><td>荒地 / 荒原</td><td>每小时5%</td></tr>
<tr><td>边陲 / 野外</td><td>每小时8%</td></tr>
<tr><td>田野 / 文明地区</td><td>每小时10%</td></tr>
<tr><td>交通频繁区</td><td>每小时12%</td></tr>
</table>
