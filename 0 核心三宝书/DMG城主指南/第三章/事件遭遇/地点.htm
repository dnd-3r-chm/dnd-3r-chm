<h1 class="title">地点</h1>
<p>站在熔岩池上的头骨桥上战斗，比在舒适安全的地下城房间里战斗要来得刺激危险。地点具有两个重要意义：一是使平凡的事件遭遇更有趣，二是使事件遭遇变简单或更困难。</p>
