<h1 class="title">较强的怪物</h1>
<p>较大的石化蜥蜴比正常石化蜥蜴拥有较多生命值与较高攻击加值，因此具有更高的挑战性。如果你使用《怪物图鉴》中为怪物增加生命骰的规则，便也该适当地增加该怪物的经验值奖赏。见《怪物图鉴》第316页“进阶怪物挑战级数”一节。</p>
<p>如果你让怪物拥有玩家人物或NPC职业的等级，请参考《怪物图鉴》第313页“怪物与职业等级”一节，以得出该生物的真正CR。</p>
