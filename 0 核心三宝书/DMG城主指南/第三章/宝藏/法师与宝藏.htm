<h1 class="title">法师与宝藏</h1>
<p>如果你设计一场与法师对决的遭遇，在决定宝藏前要先从宝藏总值中先扣除法术书及施法材料的价值（见《玩家手册》第181页“出售法术书”一节）。或者，你也可以先计算法术书与施法材料的价值，对应出表3-3的遭遇等级，然后从实际的遭遇等级中扣除对应出来的等级，再由所余等级来配予适当的宝藏。</p>
