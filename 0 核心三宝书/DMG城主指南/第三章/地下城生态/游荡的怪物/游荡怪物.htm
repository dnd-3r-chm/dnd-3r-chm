<h1 class="title">游荡怪物</h1>
<p>冒险者探索地下城时，手中提灯的光线会吸引饥饿凶暴的猎食者注意，他们会前来观察是否能捉到肥美多汁的食物。在某个坑道中，有个食腐虫盯上了冒险者，在远距离跟随着他们。当他听到打斗声，马上向前冲出，试图杀死在战斗中倒地的人物。在另一个冒险中，冒险队伍遇上了另一队冒险者。若他们能通力合作，他们可交换彼此的资讯、宝藏，甚至一起合作冒险。不过，这种遭遇也常演变成为一场硬仗。这些游荡的怪物为地下城冒险增添不可预知的力量。</p>
