<h1 class="title">地下城生态</h1>
<p>有生物居住的地下城本身即是个生态环境。住在里面的生物得进食、饮水、呼吸与睡觉，掠食者需要猎物。就像森林里或平原上的生物一样。</p>
<p>生活在地下城里的生物要能四处走动。若有锁上的门，甚至一般需要用手开启的门，都会阻挡找寻食物或饮水的生物。</p>
<p>你若想设计一个能让玩家信服的地下城，请详读本节的讨论。如果环境设计看起来没什么逻辑，玩家人物冒险时就不会思考背后的合理性。例如：在地下城发现一泓清澈的池水时，人物应可假设许多居住在此地的生物会时常来这里饮水，因此可以在该处偷袭这些生物。如果某个地下城住了许多生物，但所有门都锁上，就可能失去合理性。</p>
