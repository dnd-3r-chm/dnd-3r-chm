<h1 class="title">制作记录</h1>
<p>若你们刚结束一场单元式的冒险，你可能不需要太过详细记录，因为这些内容对整个战役剧情并无重大影响。然而，若玩家人物刚完成长篇冒险的一个段落，你就不能太过马虎。要记录下冒险任务中发生的事，包括遭遇的新NPC、击败的怪物、发现的秘密、寻得的魔法等。</p>
<p>无论哪种情形，都可以利用眼前所完成的这个冒险所发生的内容或契机，引入后续其他的冒险任务。要谨记玩家们的喜好，之后可以依此来设计及发展未来的冒险。</p>
