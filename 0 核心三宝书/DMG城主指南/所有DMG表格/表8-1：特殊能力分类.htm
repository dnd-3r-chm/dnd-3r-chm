<h1 class="title"><span class="title-square"></span>表8-1：特殊能力分类</h1>

<table>
<tr>
    <th></th>
    <th>特异能力</th>
    <th>类法术能力</th>
    <th>超自然能力</th>
</tr>
<tr>
    <td>解除魔法</td>
    <td>否</td>
    <td>是</td>
    <td>否</td>
</tr>
<tr>
    <td>法术抗力</td>
    <td>否</td>
    <td>是</td>
    <td>否</td>

<tr>
    <td>反魔场</td>
    <td>否</td>
    <td>是</td>
    <td>是</td>
</tr>
<tr>

    <td>否</td>
    <td>是</td>

<div class="notes-block">
    <p>解除魔法：“解除魔法”或类似的法术是否能够解除此类特殊能力的效果。</p>
    <p>法术抗力：法术抗力是否能够对抗此类特殊能力。</p>
    <p>反魔场：“反魔场”或类似的法术是否能够压抑此类特殊能力。</p>
    <p>借机攻击：使用此类特殊能力时，是否会如施法般引发借机攻击。</p>
