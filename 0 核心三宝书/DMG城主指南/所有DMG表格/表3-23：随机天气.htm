<html><head><title>表3-23：随机天气</title>
<meta http-equiv=Content-Type content="text/html; charset=gb2312">
<link rel="stylesheet" href="../../../cascading_stylesheet.css">
<style>
h1{color:navy}
h2{color:navy}
h3{color:royalblue}
h4{color:royalblue}
h5{color:lightsteelblue}
h6{color:lightsteelblue}
</style></head>
<body>
<div class="container">
    <div class="title">表3-23：随机天气</div>
    <table>
        <thead>
            <tr>
                <th style="width:12%">百分骰</th>
                <th style="width:16%">天气</th>
                <th style="width:24%">寒带气候</th>
                <th style="width:24%">温带气候<span class="note-ref">（注一）</span></th>
                <th style="width:24%">沙漠</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>01&#x2013;70</td><td class="state">正常天气</td><td>寒冷，平静</td><td>依季节正常变化<span class="note-ref">（注二）</span></td><td>炎热，平静</td></tr>
            <tr><td>71&#x2013;80</td><td class="state">异常天气</td><td>热浪（01&#x2013;30）或骤寒（31&#x2013;100）</td><td>热浪（01&#x2013;50）或骤寒（51&#x2013;100）</td><td>炎热，刮风</td></tr>
            <tr><td>81&#x2013;90</td><td class="state">恶劣天气</td><td>降水（雪）</td><td>降水（形态视季节而定）</td><td>炎热，刮风</td></tr>
            <tr><td>91&#x2013;99</td><td class="state">风暴</td><td>冰雪暴</td><td>雷暴，冰雪暴</td><td>沙尘暴</td></tr>
            <tr><td>100</td><td class="state">强烈风暴</td><td>风雪暴</td><td>暴风，风雪暴，飓风，龙卷风</td><td>豪雨</td></tr>
        </tbody>
    </table>
    <div class="notes">
        <p><span style="font-weight:600;">（注一）</span>包括森林、丘陵、沼泽、山脉、平原及温带水域。</p>
        <p><span style="font-weight:600;">（注二）</span>冬寒夏热，春秋温和。沼泽地区冬天会稍微温暖些。</p>
    </div>
</div>
