<h1 class="title">精制品</h1>

<p>如同《玩家手册》122页和125页所述，精制品是制作非常精细的物品。这种物品的价格比一般物品高，但品质也较好。这种物品不具魔法，然而在制造魔法防具和武器时，必须使用精制品（其他种类的魔法物品可以不是精制品）。</p>
