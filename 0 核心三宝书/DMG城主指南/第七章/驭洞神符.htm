<h1 class="title">驭洞神符 (Talisman of the Sphere)</h1>

<p>此精金打造附把手的小环只对施奥术者有用，非施奥术者若拿起或握住此神符，就会受到5d6点伤害。当施奥术者试图专注控制“毁灭黑洞”时（279页），此神符可以将计算时的智力加值及等级加倍。</p>

<p>如果控制成功，其后只需每两轮检定一次，以判定是否继续控制。如果控制失败，则“毁灭黑洞”会移向试图控制的人物。虽然多数抵消法术和效果对“毁灭黑洞”都无效，但是神符的效果却可能被抵消或压制。</p>

<p style="text-indent:2em; color:#555;">强烈变化系。施法者等级：16。重量：1磅。</p>
