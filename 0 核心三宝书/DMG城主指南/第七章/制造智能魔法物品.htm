<h1 class="title">制造智能魔法物品</h1>
<p>制造智能魔法物品时，制造者的施法者等级至少须达15级。制造时间和制造耗费都按照一般制造物品的规则计算，另外加上由表7-30（271页）之价格换算而得的时间、金钱和经验值成本。物品阵营和制造者相同。物品其他特征随机决定，参照本章各节的相关说明。</p>
