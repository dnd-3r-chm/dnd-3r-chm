<h1 class="title">物品语言</h1>

<p>就和人物一样，智能魔法物品会说通用语，每有1点智力加值就可多学会一种语言。你可考量物品的来源和意图，以选择他所用的语言。例如：智能黑暗精灵武器可能会说精灵语、“神圣”武器可能会说天界语。</p>
