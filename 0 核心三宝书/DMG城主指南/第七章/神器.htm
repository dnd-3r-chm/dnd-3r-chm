<h1 class="title">神器 (Artifacts)</h1>

<p>传说总是藏着无限神秘。强大的法师、牧师甚至神祇，曾经造出许多超过现存知识范围的物品。这些物品被后人称为神器，没有人懂得如何制造。</p>

<p>神器的力量非常强大，除了当作魔法装备之外，有时甚至成为战役剧情的重心。每件神器都可以成为冒险的主要目标，例如：找寻神器的任务、为保卫神器而战斗、试图毁灭神器等。</p>

<p>此处没有随机创造物品的表格，因为神器必须经过你的精心安排才会出现。</p>

<h2 class="sub-title">次等神器</h2>

<p>次等神器可能存在不只一件，然而制造方法早已失传。</p>
