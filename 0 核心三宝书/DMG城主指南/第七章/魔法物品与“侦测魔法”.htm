<h1 class="title">魔法物品与“侦测魔法”</h1>

<p>使用“侦测魔法”来观察魔法物品的学派时，对药水、卷轴或魔杖而言，会得知其内含的魔法属于哪个学派。对其他物品而言，则会发现制造该物品所需要的先决条件。其所属学派和等级见物品说明。</p>

<p>如果先决条件中列举了多项法术，只有等级最高的项目才会显现出来。如果先决条件中没有法术，请参考下表：</p>

<table>
    <tr>
        <th>物品种类</th><th>魔法学派</th>
    </tr>
    <tr><td>防具或保护类物品</td><td>防护系</td></tr>
    <tr><td>武器或攻击类物品</td><td>塑能系</td></tr>
    <tr><td>属性值或技能检定加值等</td><td>变化系</td></tr>
</table>

</div>
