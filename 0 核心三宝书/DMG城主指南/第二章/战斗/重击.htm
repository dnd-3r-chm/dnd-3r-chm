<h1 class="title">重击</h1>
<p>当玩家攻击检定掷出20时，你得明确指出这只是重击威胁，而非重击。把他叫成“重击”会使玩家过度期待，随后很可能被确定重击的投骰打击到。当重击达成的时候，表示目标生物身上的某个致命点被击中。这是你可以为玩家进行一些生动的描述，以提高刺激度的好机会：“这次硬头锤的挥击结结实实地砸在兽人头侧。他发出了一声惨叫，被冲击的力道打得屈膝跪倒。”</p>
