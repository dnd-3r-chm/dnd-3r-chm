<h1 class="title">规则变化：依据体型定义巨创（Massive Damage）</h1>
<p>如果生物在某次命中时受到50点或以上的伤害，就必须进行强韧检定，失败便立即死亡。这条规则的主要意义是使扣除生命值这个抽象系统显得更加真实。如果想要更进一步的真实感，你可以依据生物体型来定义“巨创”的数值，受伤生物的体型每大于中型一级，判定巨创的伤害临界便提高10点，每小于中型一级，便降低10点。这条规则对半身人、侏儒、魔宠、动物伙伴较不利；相对地，对怪物较有利。</p>

<tr><th>体型</th><th>超微型</th><th>微型</th><th>超小型</th><th>小型</th><th>中型</th><th>大型</th><th>超大型</th><th>巨型</th><th>超巨型</th></tr>
<tr><td>伤害值</td><td>10</td><td>20</td><td>30</td><td>40</td><td>50</td><td>60</td><td>70</td><td>80</td><td>90</td></tr>
