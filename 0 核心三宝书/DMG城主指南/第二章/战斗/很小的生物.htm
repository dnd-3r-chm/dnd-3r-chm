<h1 class="title">很小的生物</h1>
<p>超小型、微型、超微型生物没有天生触及距离。这些生物必须进入对方占据的方格（并因此有可能引发借机攻击）才能进行近战攻击。不然就必须持用长5英尺以上的武器。</p>
<p>由于超小型、微型、超微型生物没有天生触及距离，这些生物也无法进行借机攻击。然而某些生物有可能例外，有些持用长型武器的此类生物也可威胁到邻近方格。</p>
