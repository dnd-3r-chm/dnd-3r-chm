<h1 class="title">失败的程度</h1>
<p>检定失败通常已经给人物带来了足够的麻烦，不需再加以复杂化。然而，检定失败偶尔也可能引发额外的问题，例如触发陷阱或是引起守卫的注意等。上述可能性存在时，如果检定失败，且差距大于等于5，则该状况发生。例如：游荡者莉达“解除装置”检定失败了，且差距大于等于5，于是她触发了该装置上的陷阱。</p>
<p>失败可能造成不良后果的检定列于下表。你可以视状况增减。</p>

<table>
<tr><th>技能</th><th>风险</th></tr>
<tr><td>平衡</td><td>摔落</td></tr>
<tr><td>攀爬</td><td>摔落</td></tr>
<tr><td>手艺</td><td>浪费原材料</td></tr>
<tr><td>解除装置</td><td>触发或是使该装置变得不可解除</td></tr>
<tr><td>侦察（读唇）</td><td>误解讯息</td></tr>
<tr><td>游泳</td><td>沉到水面下</td></tr>
<tr><td>绳技</td><td>爪钩在1d4轮内松脱</td></tr>
</table>
