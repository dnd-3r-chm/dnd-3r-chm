<h1 class="title">移动与方格</h1>
<p>由于这是一个基于想象力的游戏，因此凭借一些小道具的视觉性协助，不仅有助于让每个人想象出相同的情景，还能避免造成混淆，提高整个游戏过程的乐趣。</p>
<p>在以轮为单位的模拟战斗场景中，人物的移动有时会显得不太连贯，尤其在使用小模型时更是明显。若房间大到人物得花上两轮才能穿越，看起来就会像人物跑到一半停住，然后过一会再继续跑完剩下的路程。尽管无法避免以这种开始——停止——开始——停止的模式来体现移动，但请尽量记得并提醒玩家，在遭遇中的所有移动实际上都是流畅而连贯的。</p>
