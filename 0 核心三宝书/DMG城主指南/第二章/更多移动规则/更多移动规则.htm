<h1 class="title">更多移动规则</h1>
<p>《玩家手册》已经说明了小型与中型生物的战术移动和陆上移动的规则，包括穿越大陆的旅行，以及使用“攀爬”、“跳跃”、“游泳”等技能时的情形。本节将把移动规则延伸至体型小于小型和大于大型的生物，并讨论飞行移动。</p>
