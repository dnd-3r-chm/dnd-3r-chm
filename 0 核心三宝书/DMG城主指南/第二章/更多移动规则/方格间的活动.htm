<h1 class="title">方格间的活动</h1>
<p>所有人物都挤在只有5英尺宽的狭廊中。狭廊尽头的战士中了毒，陷入濒死状态。牧师想过去帮忙，但队伍中另外两名人物挡在他们中间，使牧师无法赶到战士身边施展“中和毒性”。这种情形下，你可以在规则上允许牧师挤过其他人，来到战士身边施法再回到原处。</p>
<p>一般而言，只要人物不是处于以轮为单位的战斗状态，他们就应该可以用你所能想象到的现实人物所可以做到的任何方式，移动到任何地方。例如：在5英尺的方格内可以挤下好几个人，只是他们无法在这幺狭窄的空间里有效地进行战斗。人物小模型的移动规则对处理战斗十分重要，但在战斗之外，这些规则可能会给人物的活动带来不必要的麻烦。</p>
