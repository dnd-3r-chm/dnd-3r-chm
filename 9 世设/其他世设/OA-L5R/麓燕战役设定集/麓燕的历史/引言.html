<p>在生驹藏书楼被焚毁之后，久津天皇命令重建帝国的浩瀚史册。通过本人的勤勉研究，并大量依据生驹灯风和国余门的记述，天皇之旨已得执行。我进一步努力收录了藏书楼焚毁后的近代史事年表，以期将麓雁完整历史恢复至昔日荣光。谨于久津一世，光煌天皇在位第三十年亲笔记录。</p>
<p>——宫鸠，《帝国史记》</p>
