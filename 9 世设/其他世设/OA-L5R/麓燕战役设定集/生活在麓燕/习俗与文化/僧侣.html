<h1>僧侣</h1>
<p>这个阶级主要由新生宗的成员组成。虽然修验者也是这个群体的一部分，但从技术上讲他们也是武士，因为他们的先祖与神明有着共同的血缘关系。僧侣和修验者的角色在宗教部分有更详细的描述。</p>
