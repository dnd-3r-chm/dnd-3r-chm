<h1>艺伎</h1>
<p>艺伎是阶级中的另类。虽然她们是秽多，但她们被期望能与武士交往。实际上，在艺伎的陪伴下，武士可以表露情感和放松。艺伎主要是艺人，精通谈话、舞蹈和音乐。她们不是妓女，虽然艺伎如何与客人发展关系是她自己的事。</p>
<p>只要武士保持谨慎，他可以随心所欲。</p>
