<h1>武士</h1>
<p>在麓雁的社会阶级中，武士地位高于其他。武士身份的象征是大小对刀，即武士刀和肋差。只有武士可以拥有或携带这类武器。任何其他人被发现持有这些武器都将被处决。所有武士阶级的成员都有权获得审判，如果被另一位武士指控的话。来自低等阶级的指控则会被直接无视。</p>
