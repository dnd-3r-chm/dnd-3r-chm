<h1>凡愚</h1>
<p>这个阶级包括农民、商人和工匠，统称为平民。凡愚中地位最高的是农民，他们的劳动养活了整个帝国。农民之后是工匠，最后是商人，他们什么都不创造因此地位最低。</p>
<p>一个平民可以对另一个平民提出指控，如果他觉得自己受到了冤屈，但一个被武士冤枉的平民没有任何法律途径。一个冤枉了平民的武士不需要接受审判。武士在任何时候都可以处决平民，如果他们觉得自己受到了冤屈，而&quot;冤屈&quot;的定义由武士自行裁定。</p>
<p>平民对武士通常非常恭敬。</p>
