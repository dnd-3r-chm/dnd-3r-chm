<h1>秽多</h1>
<p>这个非群体由被视为&quot;不洁&quot;的非人组成，包括那些经常接触血肉、罪犯、娱乐者和各类流浪者。秽多在技术上不被视为人类，所以平民往往对他们很粗暴。杀死一个秽多不算犯罪，因为他们不是天道秩序的一部分。除非武士命令，秽多不得与武士说话。</p>
<p>秽多通常尽可能避开武士。</p>
