<h1>习俗与文化</h1>
<h2>天道秩序</h2>
<p>麓雁人相信万物皆为伟大天道模式的一部分，每个生灵都在其中扮演着特定角色。每个灵魂都必须完成其应尽的天命。那些违背天道秩序的人在转世后可能会降至更低的地位。</p>
<p>麓雁的社会秩序由三个明确的群体组成：武士（征战者）、僧侣（祈祷者）和平民（劳作者）。还有一个非群体，被称为非人hinin（&quot;异类&quot;）。</p>
