<h2>战役的维持</h2>
<blockquote>
<p>&quot;奇麟氏族的人,你已引起我的注意。我建议你不要浪费这份荣誉。&quot;</p>
<p>——道寺黑仁</p>
<p>比起帮助玩家创建角色并让他们协同工作这个艰巨的任务,保持他们的兴趣是更具挑战性的工作。本节不是关于如何做一个好城主的通用指南,而只是讨论麓雁战役与其他设定的不同之处。在本节中,&quot;武士&quot;指的是贵族阶级,包括武士、修验者和朝臣职业。</p>
</blockquote>
