<h1>生活在麓燕</h1>
<blockquote>
<p>在所有D20游戏世界中,《龙与地下城》的城主尤其需要对麓雁的文化和历史内涵有充分的了解。本书中关于麓雁历史文化的章节将是一份无价的参考资料,作为城主的你必须熟悉这些内容。向玩家介绍麓雁世界或许是最具挑战性的工作,因为这对很多人来说都是一个全新的社会。许多人从小就听过闪亮铠甲的骑士、强大法师和狡猾盗贼的故事,这使得《龙与地下城》的基本设定相对容易理解。而麓雁则提供了一个独特的挑战,因为这里的社会与我们现实生活中的非常不同。</p>
<p>带着这种认识,这里为你提供一些在翡翠帝国中行走的指南。</p>
</blockquote>
