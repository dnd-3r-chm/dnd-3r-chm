<h1>货币与贸易</h1>
<p>麓雁的经济充满了复杂性与不断变化。货币体系以“石”（koku）为单位，传统上以稻米的数量为基础。一石稻米的价值会随年份波动：丰收年时，单石价格相对较低，而在饥荒年时，一石稻米可能价值连城。</p>
