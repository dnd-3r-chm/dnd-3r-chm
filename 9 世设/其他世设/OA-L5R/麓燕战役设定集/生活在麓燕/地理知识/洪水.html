<h1>洪水</h1>
<p>在海啸或暴雨之后，洪水往往紧随其后。然而，与通常不可预测的海啸不同，洪水是一种可以通过准备物资和人力及时应对的灾害。作为以水稻为主食的帝国，麓雁的居民对堤坝、运河和水坝的修建得心应手。尽管偶尔会因突发性暴雨或山间融雪导致洪灾，绝大部分洪水都能被察觉并加以引导，在来临前将损失降至最低。</p>
