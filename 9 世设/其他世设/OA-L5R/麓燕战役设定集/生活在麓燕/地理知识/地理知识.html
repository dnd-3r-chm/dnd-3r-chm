<h1>地理知识</h1>
<p>麓雁的翡翠帝国是一片广袤而多样的土地，这里地貌各异，充满了丰富的自然与灵性生物。穿行于这片帝国的旅人，虽对气候与野生动植物有一定预期，但这片土地总会带来意想不到的体验，其中有时令人惊喜、却也常常充满险恶。</p>
