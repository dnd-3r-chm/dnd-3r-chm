<h1>地震</h1>
<p>地震几乎贯穿了麓雁的整个历史，无论何地都有发生。然而，有些地区，例如首都御前内府，因其地理特点更易遭遇地震，甚至频繁发生。对于麓雁的居民来说，地震往往被视为命神不满的象征。特别是大佐沃据传通过雷鸣震动大地以惩罚冒犯他的人。在山区，地震还会导致次生灾害——山体滑坡——进一步加剧了地震的破坏性。</p>
