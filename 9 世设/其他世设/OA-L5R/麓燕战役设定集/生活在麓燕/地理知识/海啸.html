<h1>海啸</h1>
<p>当海底发生强烈地震时，会形成巨大的海浪——海啸。海啸所到之处几乎摧毁一切，甚至能将整个村庄或城市从地图上抹去。不幸的是，预警机会极为有限，只有那些对水元素感应敏锐的强大修行者才能提前察觉这场灾难的到来。大多数情况下，人们直到看到出现在海平面上的巨浪才意识到危险；而此时沿海居民除了逃命几乎别无他法。有些海浪高得让人无处可逃，只能听天由命。</p>
