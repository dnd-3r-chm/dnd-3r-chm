<h1>台风（飓风）</h1>
<p>从海上席卷而来的台风是一股具有毁灭性力量的自然灾害。狂风肆虐，不仅轻易摧毁脆弱的建筑，随之而来的巨浪与洪水更是完全摧毁了风暴过后残存的一切。幸好，台风属于可预测的自然灾害，人们通常能够提前避开其路径，并尽量将损失降到最低。</p>
