<h1>气候</h1>
<p>麓雁的气候多变，与其他地区无异。帝国东海岸线绵延广阔，海洋水汽深入内陆，使这里的整体气候大多为温带。然而，在西部边远地区，例如奇麟氏族的领地，偶尔也会遭遇干旱。</p>
<p>尽管总体气候温和，但这片土地仍然因各种自然灾害而困扰。这些灾害既源于复杂的地理环境，也被视为命神愤怒之兆。它们对麓雁百姓造成了严重伤害。</p>
