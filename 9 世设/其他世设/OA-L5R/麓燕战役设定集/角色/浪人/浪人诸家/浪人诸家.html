<h3>浪人诸家</h3>
<p>除了天皇本人，浪人家族对于家族外的任何人并不具备忠诚之情。这里所介绍的三个浪人家族彼此毫无关联且互不结盟。那些希望避免与这些浪人家族有牵连的个体可以选择依附于他们最为紧密联系的武士家族以获取起始装备。</p>
