<h2>武者</h2>
<p>武者在麓燕很常见。足轻——经过训练的农民武者——构成了各氏族军队的核心。虽然足轻常被认为是农民，但并非所有足轻都满足于在田地里过活。许多足轻源自于长久的农民武者传统，并且像任何武士一样认真对待他们的遗产。许多属于巨蟹氏族和雄狮氏族的足轻一生中从未在农场工作过，而是全身心地投入到军人的职业生涯中。</p>
<p>**机制考量：**在麓燕，武者没有擅长重甲或擅长盾牌。</p>
