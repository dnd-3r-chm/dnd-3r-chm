<h2>望族</h2>
<p>在麓雁，贵族阶级业确实很强大。所有的武士、修验者和朝臣都是贵族。望族职业代表的是小贵族、ji-samurai地侍、令制国官僚和御家人gokenin(地产管理人)。望族的合理武术训练与广泛技能选择完美地代表了这一社会阶级。</p>
<p>**机制考量：**麓雁的望族没有擅长重甲或擅长盾牌。</p>
