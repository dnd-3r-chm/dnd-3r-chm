<p>在麓雁，阵营的作用相对于其他许多战役世界来说微不足道。实际上，你可以完全摒弃麓雁战役中的阵营概念，而采用更为普遍的衡量标准：荣誉。</p>
<p>荣誉在麓雁是至关重要的特质。武士通过荣誉来履行他们在天道秩序中所承担的职责，而天道秩序则决定了个体在凡间地位和身份。那些具备荣誉感的人深知自己角色，并能够出色地履行之；然而那些缺乏荣誉感者无法达到其阶级期望，甚至更糟糕地可能企图窃取超越其在天道秩序中所处位置之高位。</p>
