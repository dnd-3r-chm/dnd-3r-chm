<p><em>关于进阶职业的说明</em></p>
<p>在麓雁，最大的尊敬给予一个人所属的流派和师范。被选中接受更高级别教导意味着某人进入了进阶职业，这是一种极为荣耀的身份。武士阶层成员很少同时接受多个进阶职业，因为那会暗示新师范优于旧师范。在极少数情况下，两个友好的道场可能不会因为学生来回转换学习而产生负面影响。</p>
<p>一些进阶职业与特定氏族相关联，这意味着只有该氏族成员或与其保持友好关系者才能被允许进入这些进阶职业。</p>
