<h4>破耳人鼠</h4>
<p>破耳人鼠比其他任何部落都更深刻地理解着人类。他们长期以来为获得认同而不懈努力，虽然成果时好时坏，但他们永远不会停止在麓雁寻找自己的位置。庞大的人口赋予了他们丰富多彩的种族多样性。</p>
<ul>
<li>
<p>+2 魅力，-2 感知：破耳人鼠比其他人鼠部落更加友好和外向。</p>
</li>
<li>
<p>天赋职业：任意（在角色创建时选择一个）。破耳人鼠是多样且多才多艺的。</p>
</li>
<li>
<p>起始装备：（选择其一）</p>
<ol>
<li>
<p>精制短剑</p>
</li>
<li>
<p>短弓和20支箭。</p>
</li>
</ol>
</li>
</ul>
