<h4>贪爪人鼠</h4>
<p>贪爪部落作为盗贼的名声实至名归。这些人鼠对物质财富有着难以满足的渴望，会拿走任何能拿到的东西。</p>
<ul>
<li>
<p>+2 敏捷，-2 魅力：贪爪人鼠非常灵活狡猾，但他们不可信的行为常常惹恼他人。</p>
</li>
<li>
<p>起始装备：精制短刀knife（匕首）或投石索，25 石的随机物品。</p>
</li>
</ul>
