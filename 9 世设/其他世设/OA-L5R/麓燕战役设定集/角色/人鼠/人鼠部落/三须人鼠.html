<h4>三须人鼠</h4>
<p>三须人鼠与超越者Transcendent之间的纽带既是一种祝福亦是一种诅咒。尽管他们拥有强大无比的魔法，然而由于他们悲观预言末日的倾向，许多人鼠对其心生轻蔑。</p>
<ul>
<li>
<p>+2 智力，-2 力量：三须人鼠非常好奇，但他们往往比其他人鼠更小更弱。</p>
</li>
<li>
<p>小型：与其他人鼠不同，三须人鼠是小型生物，并获得标准的增益和惩罚。</p>
</li>
<li>
<p>天赋职业：术士。</p>
</li>
<li>
<p>起始装备：躲藏药水，潜行药水。</p>
</li>
</ul>
