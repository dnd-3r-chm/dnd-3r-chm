<p>麓雁的主要氏族（除了螳螂氏族）都是源自创立帝国的原初神明。然而，并非只有这些主要氏族效忠于天皇。历史上，一些武士因为杰出的服务而被授予自己的氏族，这些氏族被称为次级氏族。次级氏族的存在基于天皇的敕令；没有任何一个主要氏族被允许对次级氏族宣战。然而，主要氏族可以将次级氏族的侮辱视为宣战。因此，次级氏族往往要么完全避免政治，要么寻求主要氏族的支持和保护。</p>
