<p><em>低贱技能</em></p>
<p>某些技能被视为“低贱技能”。使用这些技能是不荣誉的，任何故意使用这些技能的人可能会丧失荣誉。这些技能包括但不限于以下几种：欺骗（在明知撒谎的情况下使用）、工艺（除了武器匠或制甲师，仅限于武士阶级）、易容、逃脱、伪造文书、口技、开锁、窃取财物、用毒、专业（仅限于武士阶级）、拷问。</p>
