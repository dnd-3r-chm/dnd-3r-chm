<h3>命神</h3>
<p>那些虔诚信奉命神至高者，通常都是勤奋不懈之人。他们努力模仿自己所崇拜的守护神在言行举止上的风范。例如，许多巨蟹氏族的武士以其喧闹而夸张的行为展现出大佐沃神灵的本质。无论是崇尚伟大“七命神”之一，还是敬仰自帝国建立以来升天数不胜数小命神之一，信徒们坚定地保持着相同信仰。</p>
