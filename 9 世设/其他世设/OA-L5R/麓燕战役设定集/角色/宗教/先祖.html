<h3>先祖</h3>
<p>对先灵魂灵的崇拜实际上是一种命神崇拜，然而由于存在如此众多独特的崇拜方式，因此值得单独提及。麓雁人相信存在多个魂域，其中包含冥道——这乃是死者灵魂等待轮回之所；以及祖先的祝福之地黄泉，在那里完成了此生命运之人将在幸福中安息，直至世界尽头。在麓雁，祖先的灵魂时刻与他们的后代同在，并助其引导和指引走向光荣命运。雄狮氏族则为最忠诚之祖先崇拜者。</p>
<p>那些信奉先祖至上的人往往会专注于他们认为尚未完成的事务，如亲属未解之谋杀案、祖先的耻辱，甚至未能解决的仇怨。这些问题可能成为武士一生中专注于祖先所追求的目标。</p>
