<h3>新生之道</h3>
<p>新道信仰更类似于一种哲学，而非宗教；更像是一种思维方式，而不是神学立场。神圣追随者通过完善和统一身体、心灵和灵魂来寻求精神上的启蒙。奉行这一哲学的人往往沉思克制，他们选择依赖智慧，而不屈从于情感或冲动。绝大多数僧侣都遵循着神圣之道，在凤凰氏族中也有许多武士坚持奉行这一哲学。</p>
