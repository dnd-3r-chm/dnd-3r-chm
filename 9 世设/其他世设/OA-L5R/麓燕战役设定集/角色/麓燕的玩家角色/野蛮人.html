<h2>野蛮人</h2>
<p>虽然野蛮人通常是来自文明边缘的野性战士，但奇麟氏族绝不是麓燕中唯一能够进入狂暴状态的战士。樋田和松家族以其狂战士而闻名。当然，没有人会直接称巨蟹或松家人为野蛮人（至少不在他们听得到的情况下）。大多数这个职业的成员被称为“berserkers狂战士”。</p>
<p><strong>机制考量：</strong> 非新条或樋田家族成员的一级野蛮人,则必须花费两点技能点来购买识字能力。新条和樋田野蛮人则不需要购买识字能力。</p>
