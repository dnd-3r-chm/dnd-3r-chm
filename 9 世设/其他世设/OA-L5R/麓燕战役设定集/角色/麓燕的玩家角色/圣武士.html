<h2>圣武士</h2>
<p>圣武士在麓燕中未曾听说过，尽管阿古渡和歌国家族的许多成员在某种程度上履行了类似于荣誉捍卫者的角色。简单来说，大多数麓雁人更关注荣誉与耻辱，而非善与恶，因此麓雁大陆不需要圣骑士。</p>
<p>在麓燕之外，森帕和尤多塔Yodatai的国家中有一些神圣战士。任何在麓燕内的圣武士角色肯定是个外人。他们奇怪的神授能力和魔法使用可能会在帝国中引起怀疑。</p>
<p><strong>机制考量：</strong> 无</p>
