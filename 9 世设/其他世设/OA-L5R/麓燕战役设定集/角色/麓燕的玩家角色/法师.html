<h2>法师</h2>
<p>法师对麓燕来说完全是陌生的概念。即使野蛮人、人鼠或娜迦也没有使用过类似于传统法师魔法的形式。最接近的例子可能是森帕人在遥远的燃烧沙漠另一边使用的死灵法术。虽然可以想象一个外人法师或专家可能会冒险进行漫长而危险的旅程来到这里，但这种外来魔法会遭到怀疑甚至是公开的憎恨。</p>
<p><strong>机制考量：</strong> 无</p>
