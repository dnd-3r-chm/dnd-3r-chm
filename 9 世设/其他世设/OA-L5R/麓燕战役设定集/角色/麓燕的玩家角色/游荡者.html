<h2>游荡者</h2>
<p>游荡者的特点是适应性，这一点在麓燕也同样适用。游荡者在帝国中与别处一样常见，而且种类繁多。有些人会说毒蝎氏族拥有比其他氏族更多的游荡者，不过寿龟氏族也因他们的隐秘和狡猾而闻名。游荡者更多的是兼职的武士或朝臣，以获得游荡者职业提供的隐秘和多样技能，而非单一职业的盗贼。单一职业的游荡者更常见于农民和商人阶级，或者在邪恶的疑世会中。</p>
<p><strong>机制考量：</strong> 麓燕中的游荡者不擅长使用弩。取而代之的是他们获得了弓(yumi)和大弓(daikyu)的熟练。</p>
