<h2>武僧</h2>
<p>僧侣在麓燕非常常见，许多年长的武士在退休后也会兼职武僧。武僧在帝国实际上有很多种类型，包括僧兵Sohei和隐僧Inkyo。</p>
<p><strong>机制考量：</strong> 无</p>
