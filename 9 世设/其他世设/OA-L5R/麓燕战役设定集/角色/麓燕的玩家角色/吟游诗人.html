<h2>吟游诗人</h2>
<p>麓燕没有本土的吟游诗人。此类的角色由艺人来填补，详情请参阅本书其他部分（见第65页）。虽然一个来自麓燕之外的吟游诗人可能会出现在帝国中，但他会面临任何外来角色通常要面临的困境。</p>
<p><strong>机制考量：</strong> 无</p>
