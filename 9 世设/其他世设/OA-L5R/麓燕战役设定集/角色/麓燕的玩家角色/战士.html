<h2>战士</h2>
<p>战士是武道家、足轻和次级氏族武士的常见职业。依赖多样性战斗手段的主要氏族的家族，如新条，往往会兼职武士/战士。黄蜂氏族的成员全都是战士——尽管他们技术上属于武士阶级，但缺并没有真正的武士职业成员。</p>
<p><strong>机制考量：</strong> 无</p>
