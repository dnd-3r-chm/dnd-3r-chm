<h2>牧师</h2>
<p>同样，麓雁中也没有牧师。他们的角色由修验者完成，详情请参阅《东方冒险》。虽然麓雁非常的宗教宽容（他们的宗教更多的是哲学而非教条），但他们对外来者的不容忍可能会使牧师在麓雁大陆的旅行变得困难。</p>
<p><strong>机制考量：</strong> 与神祇的分离可能会带来巨大困难。根据DM的选择，牧师可能会发现自己每天可使用的法术数量大大减少，甚至完全无效。</p>
