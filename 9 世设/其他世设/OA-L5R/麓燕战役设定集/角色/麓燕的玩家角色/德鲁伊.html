<h2>德鲁伊</h2>
<p>虽然麓雁没有德鲁伊，但北方地带的野坂部族行使的魔法形式与德鲁伊教义非常相似。因此，一名野坂角色很容易成为德鲁伊，尽管他会像任何野坂野蛮人一样，在帝国内被歧视。一些娜迦也对自然有着强烈的联系，因此，德鲁伊的道路毫无可能。娜迦德鲁伊使用的神术总是珍珠魔法。</p>
<p><strong>机制考量：</strong> 与神职人员不同，德鲁伊从未远离他们的崇拜对象——大地本身。他们的能力不变。</p>
