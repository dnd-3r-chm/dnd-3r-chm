<h2><em>东方冒险中的娜迦</em></h2>
<p>在《东方冒险》第9章中出现的娜迦与此处规则创建的娜迦存在显著差异。前者代表了一个强大的NPC对手，能够匹敌一队冒险者，并且在能力上远超麓雁中其他起始等级角色。为了平衡游戏团队，这里提供的规则允许玩家将娜迦角色培养至与《东方冒险》中所见相同的力量水平，但初始阶段较为弱小。</p>
