<h2><em>关于武士刀的说明</em></h2>
<p>武士刀在机制上与精制重剑相同。和重剑一样，单手使用武士刀需要擅长异种武器专长，但任何擅长军用武器的角色都可以双手使用它。大多数需要擅长武士刀的专长并不要求擅长异种武器，除非特别注明此要求。大多数使用武士刀的专长仅需擅长军用武器（武士职业角色则免费获得此专长）。</p>
