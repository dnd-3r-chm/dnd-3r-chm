<h2><em>荣誉与毁誉</em></h2>
<p>本书中的一些专长、技能、法术，甚至职业，要求角色必须具备荣誉或毁誉才能符合条件。这只是另一个表明在陆雁中荣誉有多重要的指示：那些不尊重武士道的人无法获得某些社会地位。</p>
<p><strong>荣誉</strong>：荣誉等级3以上</p>
<p><strong>毁誉</strong>：荣誉等级1或更低。</p>
