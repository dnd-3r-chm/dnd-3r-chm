<h2><em>虚空加值</em></h2>
<p>本书中的一些专长和能力提供了一种“虚空加值”。虚空加值源自于对元素律动的掌握，通过消耗虚空点（参见虚空掌握专长）来获得，并且可以与所有其他加值叠加，包括其他虚空加值。通常每次只能消耗一个虚空点。</p>
