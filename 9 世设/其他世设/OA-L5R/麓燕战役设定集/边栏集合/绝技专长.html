<h2><em>绝技专长</em></h2>
<p>所有氏族成员都可以学习相应的绝技专长，而不仅限于武士。例如，即使是樋田氏族的游荡者或修验者，如果满足前提条件，也可以学习_山岳不移_。战士只要出身于适当的氏族，也可以学习这些绝技专长，但不能用其战士奖励专长来学习绝技专长。只有武士可以用其奖励专长来学习技巧专长。没有特定氏族限制的绝技专长可以作为任何武士的奖励专长（或任何符合条件的角色学习）。</p>
