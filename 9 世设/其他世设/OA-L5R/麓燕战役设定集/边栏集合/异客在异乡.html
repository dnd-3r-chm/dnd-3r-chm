<h2><em>异客在异乡</em></h2>
<p>如果你选择让来自其他战役设定的角色访问麓雁，这些角色可能最终希望学习麓雁的技巧专长。任何希望学习的角色必须首先获得麓雁师傅的信任（对于外人来说是一个苦差事）并学习“相异流派”专长。之后，只要继续跟随师傅学习，角色就可以正常学习他师傅所属氏族的绝技专长。</p>
