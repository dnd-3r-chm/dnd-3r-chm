<h2><em>金币与石</em></h2>
<blockquote>
<p>在麓雁中，货币以石、钱和分为单位进行计算。将金币兑换成石时，1枚金币等于1石；将钱转换为铜币时，1枚钱等于2枚铜币；将分转换为银币时，1枚分等于半个银币。这些“汇率”仅供参考，在麓雁中实际上金币的价值取决于许多其他因素。</p>
</blockquote>
