<h2><em>异种与军用武器</em></h2>
<p>由于麓雁独特的设定，异种武器与其他战役世界中的定义完全不同。这里提供的武器列表和表格仅代表在麓雁中常见用法。例如，在麓雁中，并非每个战士都会立即掌握弩的使用技巧，但他们都会擅长武士刀的运用。</p>
