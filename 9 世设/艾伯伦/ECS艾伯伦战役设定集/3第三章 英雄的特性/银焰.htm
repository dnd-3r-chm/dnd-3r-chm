    <p>银焰属于守序善良阵营，与人类女子提拉·麦伦关系密切。麦伦已经成为永恒的存在，作为银焰之声担任无法做到绝对纯洁的凡人与神圣的银焰之间的沟通桥梁。银焰教会致力保障世界远离超自然邪恶力量的威胁，因此许多圣武士愿意为此献身。</p>
