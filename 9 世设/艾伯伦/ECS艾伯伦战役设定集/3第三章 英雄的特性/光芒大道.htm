    <h1 class="main-title">光芒大道</h1>
    <p style="font-weight:bold;text-align:center;margin-top:-10px;letter-spacing:2px;">THE PATH OF LIGHT</p>
    
    <p>居住在艾达尔的半梦灵通常不会信仰任何神祇，而是追随贯穿宇宙的伟大正能量存在伊尔亚纳（il-Yannah），或称伟大的光，属于守序中立阵营。光明大道的信徒大多是心灵术士或者心灵武士，期望能够通过冥想以及与伟大的光沟通，强化肉体和精神，并通过修行抵抗来自黑暗的侵袭，特别是隶属黑暗梦境的瑞依卓尔半魔灵。少数信仰伊尔亚纳的牧师可以获得神力，领域包括秩序，冥想和保护，偏好武器是徒手攻击。</p>
