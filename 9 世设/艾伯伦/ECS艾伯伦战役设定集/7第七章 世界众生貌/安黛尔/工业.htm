    <h1>工业</h1>
    <p>安黛尔的主要产出是农产品，可以同时供应国内市场以及出口需求。安黛尔乡村出产的燕麦，谷物，蔬菜和葡萄酒在科瓦雷大陆有口皆碑。在安黛尔的城市里，教育设施与吉拉哥相比毫不逊色，而魔法学院更是超过科瓦雷其他任何地区的水准。因此，在安黛尔受训的魔匠师，机关术士和法师往往享有更为优厚的待遇。</p>
    <p>所有龙纹家族都在安黛尔设有商会和交易所，其中<strong>林兰德家族</strong>和<strong>欧瑞恩家族</strong>的总部便设在安黛尔。林兰德家族的领袖居住在北部海岛城市暴风故里，而欧瑞恩家族的领袖则在伽利法湖东岸的通路城设有总部。</p>
