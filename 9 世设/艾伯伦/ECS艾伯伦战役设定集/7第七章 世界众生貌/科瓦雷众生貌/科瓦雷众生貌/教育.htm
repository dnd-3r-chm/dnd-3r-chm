    <h1>教育</h1>
    <p>纵览五国（或者说曾经五国的地盘）上下，系统化教学被认为是每个孩童应有的成长步骤。庄园主会为他属下农民的孩子设立学校。贵族和商人聘请私人教师为子女授课。在大中型城镇，公立学校接收所有愿意加入的学生。虽然新兴国家并未实施强制教育，但是绝大多数居民都能意识到旧伽利法王国的教育体制的诸多好处。</p>
    <p>相当数量的大专院校提供高等教育，某些宗教组织也设置类似机构。不想继续学校生活的青年可以通过实习和在职培训来完成高等教育。法师和魔匠师是例外，他们的训练过程必须包括一段时期的魔法院校培训。</p>
