    <h1>政府</h1>
    <p>伽利法王国是封建君主制，很多战后由原伽利法王国分裂出来的新国家也沿用这个体制。但是现在除传统的农民阶级外，主要城镇里也开始逐渐出现自由劳动力和业主等中间阶层。这些掌控龙纹的商业巨头通常没有任何国家立场，他们的运作大体独立于国籍之外。虽然有些商团和某些国家有着特别密切的关系。</p>
