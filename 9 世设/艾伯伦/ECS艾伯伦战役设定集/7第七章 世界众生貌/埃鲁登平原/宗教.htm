<h1>宗教</h1>
<hr>
<p>埃鲁登原野盛行德鲁伊传统。森林守望者的势力遍布整个国度，多数社群中都有守望者的德鲁伊担任精神指导和技术顾问。森林守望者致力于在人类社会发展和自然成长之间寻找平衡点。与灰烬誓盟不同，他们容许农业和畜牧业的存在，只要自然之物得到应有的尊重，他们也不反对狩猎谋生。森林守望者把妖精类视为自然的结晶，认为摧毁树精居住的树木是很严重的罪行。</p>

<p>东部原野地区的村庄大多遵循德鲁伊的教诲和权威，但其中仍流传着部分其他传统，守望者也从不干涉村民的宗教信仰。原野上散布着少量神庙，其中包括天命诸神中的杜·哈拉，欧拉卓，博得雷，特别是阿拉瓦依和巴力诺广受崇拜。</p>
