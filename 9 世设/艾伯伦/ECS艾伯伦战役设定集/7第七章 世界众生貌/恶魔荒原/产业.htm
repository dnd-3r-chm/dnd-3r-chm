<h1>恶魔荒原 - 产业</h1>
<hr>
<p>无论定居在罕无人迹的沙滩平原上，还是在迷峰群谷狰狞的山地中挣扎求生，恶魔荒原上的人类居民从来没有与外界沟通的愿望。相反他们却一直很努力地抵制龙纹家族的成员前来此处勘探资源。野蛮人部落很积极地保护这里的特产品奈石和埋藏在火山沉积岩中的龙晶，以及其他隐藏在邪兽鬼遗迹中的上古神器。</p>

<p>如果定要说恶魔荒原对外也有出口产品的话，那就是诡计和谎言。砂主的成员致力于将恶魔作风传播到科瓦雷大陆各个角落。他们潜伏在阴影里长达数世纪，向外界悄悄播撒毁灭和混乱的种子，同时也为他们个人的野心寻求机会。</p>
