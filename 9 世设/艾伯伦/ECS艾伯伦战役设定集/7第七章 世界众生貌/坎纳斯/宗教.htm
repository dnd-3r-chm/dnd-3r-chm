<h1>宗教</h1>
<hr>
<p>天命诸神是坎纳斯的主要信仰，其中神庙主要供奉的是博得雷，杜·阿拉，杜·顿恩和欧拉卓。由于与瑟雷恩关系紧张，银焰教会在坎纳斯只是一个标记，只有寇斯和维迪卡城内有小规模的银焰社群。少量但不容忽视的民众仍然在追随沃尔之血的教义，虽然国王已经明确和这个教派脱离关系，但位于埃图尔的猩红修道院内仍不时举行崇拜鲜血力量和探索亡灵神秘的祭祀活动。需要注意的是，普通沃尔之血教徒并不知道巫妖沃尔的存在，也不认为这个教派是邪恶的，他们只是单纯将鲜血视为生命的源泉，将亡灵视为通往神性的道路。</p>
