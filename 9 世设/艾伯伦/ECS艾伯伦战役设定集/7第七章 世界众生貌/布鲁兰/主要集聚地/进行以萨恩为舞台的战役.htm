            <p>
                布鲁兰的国际化和风气使这里非常适合作为你第一个艾伯伦战役的舞台。这里会发生各式各样的事件。也能够很容易的接触到所有的种族，了解种族之间的关系。冒险者们也对布鲁兰政府和法律所赋予的自由和权利感到满意。
            </p>

                其中，<strong>萨恩尤其适合作为冒险的起始地点或是冒险舞台</strong>。即使冒险没能主动降临到冒险者头上，他们也能通过发达的交通去追逐冒险（毕竟条条大路通萨恩）。
            </p>
