    <h1 class="main-title">主要集聚地</h1>
    
    <p class="content-text">
        农场，牧场以及贵族城堡点缀着布鲁兰郊区，分部在北部开阔地带以及南部河流边缘。布鲁兰半数人口居住在乡下的农场牧区，其中农民们在贵族封地里工作。其他半数人口则聚集在王国贸易工业中心的城市中及其周边地带。<strong>沃奥特</strong>和<strong>萨恩</strong>是王国最著名的两个大型都市，其他还有星星点点的大小城镇散落。拥有万塔都市之称的<strong>萨恩</strong>同时也是整个大陆的都市之最，不仅是面积最大，同时也是定居人口最多的城市。
    </p>
