<h1>产业</h1>
<hr>

<p>曾经塞尔以优质的制造业以及精美的手工艺品知名。五国所有的权贵都为拥有几件产自塞尔的收藏品感到自豪。费奥兰家族在塞尔设立总部，表演艺术行会在这个创造力发达的国度茁壮成长。（有传言说费奥兰家族知道大爆炸的到来，因为悲叹之日那天恰好所有家族人员都被派去执行任务。）而如今哀伤故地仅有的产出是悲痛与恐怖，偶尔有人能找到一些遗留的艺术品，追悼着曾经幸福的时光。</p>
