    <h1 class="main-title">半兽人（HALF-ORCS）</h1>

    <p>半兽人在科瓦雷大陆并不太常见，这里人类和兽人很少结合。在阴影湿地零散的小规模人类聚居地里，半兽人则相对常见，而埃鲁登原野和卓姆也有半兽人的身影。在阴影湿地，半兽人与人类共同过着乡村生活，相对很久以前野蛮人的时代已文明许多。在这些地区，除了体型和力量，半兽人与人类并没有更多区别。</p>

    <p><b>居住地：</b>半兽人没有属于自己的故乡，他们大多居住在阴影湿地，埃鲁登原野以及卓姆的人类或兽人聚落。部分半兽人也能在科瓦雷鱼龙混杂的大城市里找到自己的位置。</p>

    <p><b>龙纹：</b>萨拉释克家族由人类和半兽人共同组成，继承探索龙纹，控制着调查以及龙晶勘探业。</p>
