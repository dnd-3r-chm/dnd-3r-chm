<body><!DOCTYPE html>

<head>

<title>冒险者的准备</title>
<style>
    /* 全局样式 */
    body {
        background-color: #f0f2f5;
        
        
        
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        font-family: "Songti SC", "SimSun", "STSong", serif; /* 使用宋体/衬线体以匹配书籍风格 */
    }

    /* 纸张容器 */
    .paper-container {
        background-color: #ffffff;
        width: 100%;
        max-width: 700px;
        padding: 60px 80px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border-radius: 4px;
        color: #2c2c2c;
        line-height: 1.8;
        font-size: 19px;
        text-align: justify; /* 两端对齐 */
    }

    /* 首字下沉效果 (那个大大的“在”字) */
    .drop-cap::first-letter {
        float: left;
        font-size: 5.5em; /* 字号放大 */
        line-height: 0.8; /* 调整行高以对齐顶部 */
        padding-right: 12px;
        padding-top: 5px;
        font-weight: normal;
        color: #000;
        font-family: "KaiTi", "楷体", serif; /* 首字看起来更像楷体或细宋体 */
    }

    /* 段落间距 */
    p {
        margin-bottom: 20px;
        text-indent: 2em; /* 首行缩进 */
    }
    
    /* 修正第一段因为首字下沉导致的缩进问题 */

        text-indent: 0; 
    }

    /* 移动端适配 */

        .paper-container {
            padding: 30px 20px;
            font-size: 17px;
        }
        .drop-cap::first-letter {
            font-size: 4em;
        }
    }
</style>

<body>

<div class="paper-container">
    <p class="drop-cap">
        艾伯伦，装备精良的冒险者必须提前做好一切准备。冒险者可能某天去了一趟萨恩的下水道地下城以后，第二天就出发探索阴影湿地的沼泽。一个任务可能需要长途跋涉到霜落之地的寒冷荒原，飞行到希恩德瑞克热气腾腾的丛林，最后还要拜访凯博尔的无光深渊。无论如何，当冒险者回到文明社会后，龙纹家族和他们雇佣的魔匠师能用魔法提供大部分龙与地下城世界根本就没听说过的便利，从翱翔的魔法飞船到公共宴会上的英雄宴。
    </p>
    <p>
        本章涵盖了大部分非魔法装备的各种有关问题，是每一个冒险者都需要注意以便利用的。当意外来势汹汹，危险出现在黑暗中，从新的武器盔甲到成套的冒险设备，你永远不知道什么能够改变你的生死。
    </p>
</div>
