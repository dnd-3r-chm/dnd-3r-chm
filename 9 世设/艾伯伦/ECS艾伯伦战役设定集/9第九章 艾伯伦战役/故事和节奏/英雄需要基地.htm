    <h1 class="main-title">英雄需要基地</h1>
    
    <p>玩家队伍选择活动基地非常重要，他们在完成冒险后通常会回到固定地点进行修正。萨恩非常适合担当这样的角色：重要都市，接近希恩德瑞克，各种研究机构，犯罪组织和腐败势力鱼龙混杂，英雄可以在萨恩遭遇低等级挑战，并购买物品。对玩家而言，掌握活动基地的商业和非玩家角色，逐渐对周围环境发展出感情，并在当地居民间建立起自己的名望都非常重要。而您更是可以利用英雄对定城市或是特定居民的感情推进情节。同时，随着英雄逐渐习惯在特定城市或国家里生活，就越需要保持自己的名望和口碑。</p>
