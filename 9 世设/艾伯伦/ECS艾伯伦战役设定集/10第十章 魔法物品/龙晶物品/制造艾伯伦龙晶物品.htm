    <h1 class="main-title">制造艾伯伦龙晶物品</h1>
    
    <p>
        制造包含艾伯伦龙晶的魔法物品通常需要首先将龙晶针对将要储存的法术进行调整。调整龙晶与制造的市场价格 <strong>100 金币</strong> 的魔法物品相仿。过程需花费 <strong>1 天</strong>时间，<strong>制造奇物</strong>专长，并花费 <strong>50 金币</strong>和 <strong>4 点经验值</strong>。
    </p>

    <p>
        对类似<strong>不灭灯笼</strong>这样的物品而言，只需对经过调整的艾伯伦龙晶施展恒定法术，调整消耗与其他原料消耗相加，其中只有调整龙晶算是制作魔法物品的过程。
    </p>

    <p>
        而对类似<strong>永恒魔杖</strong>的物品而言，调整龙晶的消耗已计入制造物品的消耗，而相应的市场价格（<strong>100 金币</strong>）也已计入市场价格。
    </p>
