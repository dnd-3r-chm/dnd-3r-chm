    <h1>潜能点（ACTION POINTS）</h1>
    <p>怪物通常不能使用潜能点，即使拥有玩家职业等级或进阶职业等级也不能通过升级获得潜能点。潜能点是玩家的特权，不是给怪物用的。</p>
    <p>不过怪物可以通过英雄本色专长来获得使用潜能点的能力，这专长能在每个等级级给予 3 点潜能点。DM不应该将这个专长滥发，只有对战役和故事情节来说非常重要的怪物才有资格取得此专长。</p>

    <h2>伤害减免<br><span style="font-size: 0.8em; color: #6b0f2e;">DAMAGE REDUCTION</span></h2>
    <p>本章中有几个怪物拥有只能被第六章中的新材料——拜拾克金和塔伽斯金克服的伤害减免。</p>
