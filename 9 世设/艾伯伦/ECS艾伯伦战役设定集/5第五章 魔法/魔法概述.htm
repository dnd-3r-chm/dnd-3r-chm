    <h1>魔法概述</h1>
    
    <p>
        <span class="drop-cap">魔</span>法是艾伯伦世界的根本，魔法的力量在环绕着世界的西伯瑞斯环汹涌澎湃，魔法束缚着凯博尔地底世界深处最邪恶的魔鬼。魔法好像就是世界本身，那种专门用来改变自然界规律的能量。本章将介绍魔法在艾伯伦世界的地位，部分新魔法效果规则例如魔物附身或是同调天族，艾伯伦世界的宇宙观，以及各种施法职业的新法术。
