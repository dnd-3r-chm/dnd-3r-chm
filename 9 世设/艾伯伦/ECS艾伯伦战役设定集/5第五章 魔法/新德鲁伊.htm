<div class="scroll-container">
    <h1>新德鲁伊（护门者）法术</h1>
    
    <p class="intro-text">
        以下新法术是为历史悠久的护门者德鲁伊准备的。拥有护门者专长的德鲁伊，或是护门者教派的巡林客能将以下法术加入法术列表。
    </p>

    <!-- 1环法术 -->
    <div class="spell-entry">
        <span class="spell-level">1 环</span>
        <div class="spell-content">
            <span class="spell-name">侦测异怪<span class="asterisk">*</span>：</span>
            <span class="spell-desc">侦测 60 尺内的异怪。</span>
        </div>
    </div>

    <!-- 2环法术 -->
    <div class="spell-entry">
        <span class="spell-level">2 环</span>
        <div class="spell-content">
            <span class="spell-name">自然纯净法域<span class="asterisk">*</span>：</span>
            <span class="spell-desc">弱化区域内的异怪，强化区域内的植物和精类生物。</span>
        </div>
    </div>

    <!-- 4环法术 -->
    <div class="spell-entry">
        <span class="spell-level">4 环</span>
        <div class="spell-content">
            <span class="spell-name">自然之怒<span class="asterisk">*</span>：</span>
            <span class="spell-desc">异怪晕眩并受到伤害，其他生物受到伤害。</span>
        </div>
    </div>

    <!-- 7环法术 -->
    <div class="spell-entry">
        <span class="spell-level">7 环</span>
        <div class="spell-content">
            <span class="spell-name">回归自然<span class="asterisk">*</span>：</span>
            <span class="spell-desc">降低目标的智力和魔法能力。</span>
        </div>
    </div>

</div>
