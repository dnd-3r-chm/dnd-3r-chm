    <p><strong>中立雄性老年金龙</strong></p>
    <p>如同龙之宝库般严密守护的森林，终将丧失其蓬勃生机。唯有那金色的火焰，方能赋予生命——它象征着重生与不朽�?/p>

    <h2>标题为“By Gilded Fire”的寓言</h2>
    <p>被归于敏提普·月银辉（Mintiper Moonsilver）名下，Year of the Moonfall�?344DR）�?/p>
    <p>Aerosclughpalar出生于Year of the Burning Tree�?90DR），现在他进入了他的巅峰期。他有两只向后弯的角，两条褶边装饰着他的长脖子，还有对于金龙来说常见的猫一般的胡子。他的金色鳞片上染着灰绿色的青苔，他的瞳孔变淡得像是液态的绿宝石�?/p>

    <h2>宝库</h2>
    <p>Gildenfire的宝库几乎是认不出来的，因为他真得珍爱整个至高森林。不过，这个龙类德鲁伊建立了8个遍布于巨大的北方森林的“财宝隐藏处”。每个隐藏处由一片weir tree树林构成，这个贵重的物种现在非常罕见，几个世纪以来，他精心地把它们塑造成往昔的龙的活塑像�?/p>
    <p>Gildenfire放置的持续附魔（类似于舞光术）使这些weir tree随着舞动的光球一起闪烁，使得某些旅人错误地推测这些树林里居住着鬼火（Will o' Wisp）。Gildenfire（用形形色色的徽记和结界）抵御闯入者，但心地纯洁（善良或至少是非邪恶阵营）的那些可以不受阻碍地走过它们�?/p>
    <p>每片森林的中心有一棵用金、银或某种其它贵金属做成的大树，一个永久幻象（<em>permanent illusion</em>）把它伪装成活的weir tree�?/p>
    <p>这些树木内藏有各种珍贵宝物，包括�?/p>

    <h2>巢穴</h2>
    <p>Aerosclughpalar居住在现在被称为Tall Trees的居民点里的一棵巨大的weir tree的树根下的一个小石洞里，那里从前是Teuveamanthaar的Eaerlanni都市。然而，他把大部分时间用于在至高森林里漫步，注意其居民，并保护这片大森林，抵御可能掠夺它的跨位面特工�?/p>

    <h2>战术</h2>
    <p>Aerosclughpalar谨慎、有耐心，倾向于在行动前仔细地观察与思考。他艰难地学会了自然的适应性很强，生命的循环能够在它的自然进程中处理大多数失衡。察觉到来自下层位面的威胁时，他会毫不犹豫地以决定性力量迅速行动�?/p>
    <p>战术上，他主要关心完成任务，对于曾经被说服遵守的法律或道德准则，他不表现出丝毫关心�?/p>

    <h2>已知盟友</h2>
    <p>多年来，Aerosclughpalar以叫做Vaeros Fireshield的人类身份生活。他与梅莉凯（Mielikki）、埃达丝（Eldath）等神祇的信徒密切合作�?/p>
    <p>Gildenfire是古老的树人Turlang的密友，他多次与竖琴手和试图建立新Eaerlann的精灵族合作�?/p>

    <h2>已知敌人</h2>
    <p>作为Tall Trees CoV的德鲁伊的成员，“Vaeros”敌视地狱门堡的幸存恶魔的阴谋、Nether Mountains和至高森林的兽人，以及近来被放出的House Dlardrageth CoR的fey'ri和Eldreth Veluuthra CoR�?/p>

    <h2>计划</h2>
    <p>虽然Aerosclughpalar不被其它金龙视为离群者，但他的哲学观点确实与他的大部分其它同类存在分歧。这条“德鲁伊龙”（Druid Dragon）相信所有物种最好允许自然之手——虽然严厉——从生命的循环中剔除弱者和疾病，让新生命繁荣�?/p>
    <p>因此，他在Vaeros的伪装中致力于清除对至高森林的跨位面威胁和试图颠覆自然秩序的异界�?/p>

    <h2>知识检�?/h2>
    <p>只有Sinklayr Greenstroke、Uthgang Jyarl和一些金龙与银龙知道Vaeros的真正身份。玩家角色必须通过认真的调查和角色扮演，或者通过DC35的逸闻知识、知识（地理）或知识（地方：至高森林）检定自己推理出Vaeros Fireshield与Gildenfire之间的联系�?/p>
    <p>确定Vaeros Fireshield就是Aerosclughpalar之后，在地图上定位该龙的巢穴需要成功通过DC15的逸闻知识、知识（地理）或知识（地方：至高森林）检定�?/p>
    <p>询问过一个以上的Tall Trees的德鲁伊的玩家角色可以通过成功的DC20的搜集信息检定得知Vaeros Fireshield的描述、巢穴、战术、已知盟友和已知敌人。他们能够通过DC30的搜集信息检定得知Gildenfire的传言中的宝库和计划�?/p>

    <h2>冒险诱因</h2>
    <p>玩家角色可能在探索至高森林期间遇到人类形态的Vaeros。如果玩家角色正在与来自地狱门堡或House Dlardrageth的恶魔战斗，Vaeros可能在战斗中加入他们。然而，如果玩家角色正在攻击强大的捕食性怪物，Vaeros可能尝试调停，主张应当允许自然进行其进程�?/p>

    <h2>龙狂</h2>
    <p>Gildenfire通过搬到凶暴树林——至高森林的中心里的癌变污点——的中心来为龙狂做准备。就像计划的那样，最终屈服于魔法的疯狂时，这条金龙把它的疯狂用在了粉碎凶暴树林的石化树木和追猎在它们的树枝下潜行的异怪上�?/p>
