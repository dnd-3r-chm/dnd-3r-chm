    <h2>教会的特�?/h2>
    <p>和她统治的彩色龙一样，提亚马特贪婪而自私。不同之处在于她的组织和控制。虽然彩色龙往往是混乱的，但五头龙后严格而专注。对于提亚马特和她的教会来说，最重要的事情是力量和财富�?/p>
    <p>在追求力量的过程中，他们的堕落和扭曲是无限的。该教会不仅通过扩张获得力量，而且通过其它强大组织-尤其是其它信�?这样做�?/p>

    <h2>组织结构</h2>
    <p>提亚马特的神殿划分为严格的等级制度。在恩瑟的提革拉的领导下，牧师们按照彩色龙的颜色组织。最低级的牧师被称为白色能手(white adept)，最高级为红色能手。力量的获取和大胆的行动有助于提高提亚马特的牧师的地位�?/p>

    <h2>成员</h2>
    <p>人们为了各种理由加入提亚马特的教会。有些人为了纯粹的政治理由而让自己或孩子入教，其他人出于对龙或Dark Lady的使命感而加入。许多人只是为了获得力量而加入�?/p>
    <p>持久而剧烈的竞争推动提亚马特的教会前进。对于牧师来说，任何恐惧或软弱的迹象都可能标志着结束�?/p>

    <h2>魔法与神�?/h2>
    <p>提亚马特的信徒渴望获得能够增强他们的身体和灵魂的力量的物品，包括普通的魔法物品和强大而罕见的神器�?/p>
    <p>提亚马特教导人们必须因他们的成功得到荣誉并理解他们的损失，因此除最激烈的情况外，她完全反对使用医疗魔法�?/p>

    <h2>五头龙后的仆从们</h2>
    <p>提革拉和Shudu-Ab是提亚马特教会的两位主要领导者，他们之间的权力斗争推动了教会的演变�?/p>
    <p>提革拉希望团结教会，而Shudu-Ab则引导教会朝着更严厉和竞争的方向发展�?/p>

    <p>提亚马特之爪是一个特殊的进阶职业，尤其适合Dark Lady教会的成员。它给予他们与善龙战斗和帮助恶龙的能力�?/p>

    <h2>其他仆从</h2>
