<body><h1>前言</h1>
<p>对死后所发生的事情的预期驱动着人物的许多行为。虔信者死后将去往何处？在他们到达时他们又将做什么？当然，宗教在日常生活中的体现方式也影响着人的行动。对一个完整的神力世界的讨论同时包含着信徒的死后世界与日常生活。</p>
