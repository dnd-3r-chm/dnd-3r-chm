</style></head><body><div class="container"><h1>尤格罗斯魔</h1><p>尤格罗斯魔是贪婪、恶毒、毫无荣誉可言的生物，原生于永恒荒凉之焦炎地狱（Bleak Eternity of Gehenna）。它们乐于为出价最高者效劳，不论是为恶魔还是魔鬼服务，均无任何忠诚可言，往往参与下层位面的永恒冲突。尤格罗斯魔的最大乐趣便是带来苦难。</p><p>术语表列出了所有尤格罗斯魔共有的种族特性。</p><h2>本分类条目</h2><div class="index-links"><a href="命运腐化者.htm">命运腐化者</a><br><a href="沃尔.htm">沃尔</a><br></div></div>
